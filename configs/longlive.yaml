name: longlive
description: "LongLive-1.3B — interactive causal inference (open-source)"
mode: interactive
fps: 16
max_num_frames: 240
frame_snapping: "multiple_of_3"
code_dir: "video_generation_models/LongLive"

model_path:
  default: "${LONGLIVE_MODEL_PATH:-models_cache/LongLive/longlive_models/models/longlive_base.pt}"
  lora: "${LONGLIVE_LORA_PATH:-models_cache/LongLive/longlive_models/models/lora.pt}"

generation:
  command: |
    {torchrun} --nproc_per_node={num_gpus}
      {code_dir}/interactive_inference.py
      --config_path "{config_path}"

runtime_config:
  denoising_step_list: [1000, 750, 500, 250]
  warp_denoising_step: true
  num_frame_per_block: 3
  model_kwargs:
    local_attn_size: 12
  data_path: "{data_path}"
  output_folder: "{output_dir}"
  inference_iter: -1
  num_output_frames: "{num_frames}"
  use_ema: false
  seed: 42
  num_samples: 1
  save_with_index: true
  switch_frame_indices: "{switch_frame_indices}"
  context_noise: 0
  generator_ckpt: "{generator_ckpt}"
  lora_ckpt: "{lora_ckpt}"
  adapter:
    type: lora
    rank: 256
    alpha: 256
    dropout: 0.0

output_patterns:
  - "rank*-*-*_*.mp4"